
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tone.js Chord Player</title>
  <script src="https://unpkg.com/tone@14.8.39/build/Tone.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { font-size: 18px; padding: 10px 20px; margin: 10px; }
    #output { margin-top: 20px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Play C Major Chord</h1>
  <button id="play">Play C chord</button>
  <div id="output">準備好播放</div>

  <script>
    const synth = new Tone.PolySynth(Tone.Synth).toDestination();

    document.getElementById("play").addEventListener("click", async () => {
      await Tone.start(); // 啟動音訊環境
      document.getElementById("output").innerText = "Playing C - E - G";
      synth.triggerAttackRelease(["C4", "E4", "G4"], "1n");
    });
  </script>
</body>
</html>
